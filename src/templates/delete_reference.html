{% extends "layout.html" %}

{% block title %} Delete Reference {% endblock %}

{% block content %}
    <h1>Delete Reference</h1>
    <p>Are you sure you want to delete this reference?</p>
    <form action="/delete_reference/{{ reference.id }}" method="post">
        <input type="submit" name="delete" value="Delete">
        <input type="submit" value="Cancel">
    </form>
{% endblock %}
